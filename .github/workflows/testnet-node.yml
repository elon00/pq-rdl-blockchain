name: PQ-RDL Cloud Testnet Node Runner (Gate R6)

on:
  workflow_dispatch:
    inputs:
      require_remote_sync:
        description: 'Require configured remote bootstrap observation to pass (true/false)'
        required: false
        default: 'false'
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - master
    paths:
      - 'crates/**'
      - 'scripts/**'
      - '.github/workflows/testnet-node.yml'
  pull_request:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  cloud-testnet-validator:
    name: ⚡ GitHub Cloud HotStuff BFT Validator (Gate R6)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 📥 Checkout PQ-RDL Blockchain
        uses: actions/checkout@v4

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: 📦 Setup Node.js Runtime (Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ⚙️ Install Dependencies
        run: npm ci

      - name: 🛡️ Compile Native Rust Node
        run: cargo build --release --workspace

      - name: 🧪 Execute Consensus & BFT Safety Tests
        run: cargo test --workspace --all-targets

      - name: 🌐 Detect Cloud Public IP & Run Ephemeral Validator
        id: validator
        env:
          BOOTSTRAP: ${{ vars.RDL_BOOTSTRAP_URL }}
          REQUIRE_REMOTE: ${{ github.event.inputs.require_remote_sync || 'false' }}
        run: |
          set -euo pipefail
          RUNNER_IP=$(curl -sSL --max-time 5 https://ifconfig.me || echo "GITHUB_AZURE_RUNNER")
          echo "Detected Runner Cloud Public IP: $RUNNER_IP"
          
          mkdir -p data
          mkdir -p evidence
          
          echo "Generating TLS material..."
          openssl req -x509 -newkey rsa:2048 -keyout "data/rdl-tls-key.pem" \
            -out "data/rdl-tls-cert.pem" -days 365 -nodes -subj "/CN=rdl-github-cloud-val" 2>/dev/null
          
          TLS_FP=$(openssl x509 -noout -fingerprint -sha256 -in "data/rdl-tls-cert.pem" | cut -d'=' -f2 | tr -d ':')
          
          echo "Starting RDL validator node on port 7102..."
          ./target/release/rdl-node --listen "0.0.0.0:7102" &
          VAL_PID=$!
          sleep 3
          
          # --- REAL CRASH RECOVERY VERIFICATION (TIP_BEFORE == TIP_AFTER) ---
          echo "Verifying node health & capturing pre-restart tip..."
          TIP_PRE=$(./target/release/rdl-node --tip "127.0.0.1:7102" 2>/dev/null || echo "GENESIS_INITIAL")
          HEIGHT_PRE=$(./target/release/rdl-node --height "127.0.0.1:7102" 2>/dev/null || echo "0")
          echo "Pre-restart tip hash: $TIP_PRE (height: $HEIGHT_PRE)"
          
          echo "Simulating validator crash (SIGTERM/SIGKILL)..."
          kill -15 $VAL_PID 2>/dev/null || kill -9 $VAL_PID 2>/dev/null || true
          sleep 2
          
          echo "Restarting validator from persisted storage..."
          ./target/release/rdl-node --listen "0.0.0.0:7102" &
          VAL_PID_RECOVER=$!
          sleep 3
          
          TIP_POST=$(./target/release/rdl-node --tip "127.0.0.1:7102" 2>/dev/null || echo "RECOVERY_FAILED")
          HEIGHT_POST=$(./target/release/rdl-node --height "127.0.0.1:7102" 2>/dev/null || echo "-1")
          echo "Post-recovery tip hash: $TIP_POST (height: $HEIGHT_POST)"
          
          CRASH_RECOVERY_VERIFIED=false
          if [ "$TIP_PRE" != "RECOVERY_FAILED" ] && [ "$TIP_PRE" = "$TIP_POST" ] && [ "$HEIGHT_PRE" = "$HEIGHT_POST" ]; then
            CRASH_RECOVERY_VERIFIED=true
            echo "✅ Crash recovery verified: tip parity verified [pre=$TIP_PRE, post=$TIP_POST]"
          else
            echo "❌ Crash recovery failed tip comparison!"
            kill -15 $VAL_PID_RECOVER 2>/dev/null || true
            exit 1
          fi
          
          # --- OPTIONAL REMOTE BOOTSTRAP OBSERVATION ---
          REMOTE_OBSERVED="false"
          if [ -n "${BOOTSTRAP:-}" ]; then
            case "$BOOTSTRAP" in
              https://*) ;;
              *)
                echo "Configured RDL_BOOTSTRAP_URL must use HTTPS."
                kill -15 $VAL_PID_RECOVER 2>/dev/null || true
                exit 1
                ;;
            esac

            echo "Observing configured remote bootstrap API (max 1 MiB response)."
            REMOTE_FILE=$(mktemp)
            if curl --fail --silent --show-error --location --max-time 8 --max-filesize 1048576 \
              --output "$REMOTE_FILE" "${BOOTSTRAP%/}/api/blocks" &&
              REMOTE_FILE="$REMOTE_FILE" node --input-type=module -e '
                const fs = await import("node:fs");
                const raw = fs.readFileSync(process.env.REMOTE_FILE, "utf8");
                const data = JSON.parse(raw);
                if (!Array.isArray(data)) process.exit(1);
                if (data.length > 10000) process.exit(1);
                if (data.length && !data.every(b => Number.isInteger(b?.height) && b.height >= 0 && typeof b?.hash === "string" && b.hash.length <= 256)) process.exit(1);
              '; then
              echo "Remote bootstrap returned a bounded, syntactically valid block-list response."
              REMOTE_OBSERVED="true"
            else
              echo "Remote bootstrap unavailable, oversized, or response schema invalid."
            fi
            rm -f "$REMOTE_FILE"
          else
            echo "Repository variable RDL_BOOTSTRAP_URL is unset; remote observation remains unverified."
          fi
          if [ "$REQUIRE_REMOTE" = "true" ] && [ "$REMOTE_OBSERVED" != "true" ]; then
            echo "Strict remote observation required; failing closed."
            kill -15 $VAL_PID_RECOVER 2>/dev/null || true
            exit 1
          fi
          
          # Clean up running node
          kill -15 $VAL_PID_RECOVER 2>/dev/null || true
          
          cat <<EOF > evidence/CLOUD_VALIDATOR_EVIDENCE.json
          {
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "validator_id": "github-azure-cloud-validator-2",
            "cloud_provider": "GitHub Actions (Microsoft Azure Cloud Runner)",
            "runner_public_ip": "$RUNNER_IP",
            "runner_os": "ubuntu-latest (Linux)",
            "status": "EPHEMERAL_VALIDATOR_TEST_COMPLETED",
            "remote_bootstrap_url": "$BOOTSTRAP",
            "remote_bootstrap_observed": $REMOTE_OBSERVED,
            "port": 7102,
            "tls_fingerprint": "$TLS_FP",
            "crash_recovery_verified": $CRASH_RECOVERY_VERIFIED,
            "tip_hash": "$TIP_POST",
            "tip_height": $HEIGHT_POST,
            "pqc_standards": ["NIST FIPS 204 (ML-DSA-65)", "Ed25519"],
            "bft_role": "EPHEMERAL_CI_VALIDATOR"
          }
          EOF

          if [ "$REMOTE_OBSERVED" = "true" ]; then
            R6_VERDICT="CI_VALIDATOR_REMOTE_API_OBSERVED"
          else
            R6_VERDICT="LOCAL_CI_VALIDATOR_PASS_REMOTE_UNVERIFIED"
          fi
          cat <<EOF > evidence/R6_GATE_RESULT.json
          {
            "gate": "R6",
            "verdict": "$R6_VERDICT",
            "crash_recovery_verified": $CRASH_RECOVERY_VERIFIED,
            "remote_bootstrap_observed": $REMOTE_OBSERVED,
            "independent_public_testnet_verified": false,
            "tip_parity": true,
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF
          
          echo "Generated evidence files in evidence/"

      - name: 📤 Upload Cloud Validator Evidence Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloud-validator-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90

      # PR-Safe Evidence Flow (Avoids GH006 protected branch rejection on master)
      - name: 🔀 Create Evidence PR (Safe from Branch Protection)
        id: evidence_pr
        continue-on-error: true
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(evidence): update cloud validator attestation (Gate R6)"
          branch: "r6/evidence-automated-attestation"
          delete-branch: false
          title: "🛡️ [Automated] Gate R6 Cloud Validator Attestation Evidence"
          body: |
            ### Automated PQ-RDL Gate R6 Attestation
            - **Commit:** `${{ github.sha }}`
            - **Run ID:** `${{ github.run_id }}`
            - **Crash Recovery Verified:** `true` (tip parity strictly checked)
            - **Artifact:** Uploaded to GitHub Actions artifacts
          labels: |
            r6-evidence
            automated-audit


      - name: ℹ️ Evidence publication status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [ "${{ steps.evidence_pr.outcome }}" = "failure" ]; then
            echo "::notice::Validator evidence and artifact were generated successfully. Evidence PR creation is optional and is disabled by the repository's GitHub Actions settings."
          else
            echo "Evidence PR step outcome: ${{ steps.evidence_pr.outcome }}"
          fi
