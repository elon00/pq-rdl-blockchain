name: QMoosa Reality Mode CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  reality-finish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start and Finish Everything — Reality Mode
        id: reality_mode
        run: npm run qmoosa:finish
        continue-on-error: true
      - name: Upload reality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qmoosa-reality-report
          path: |
            qmoosa-reality-report.json
            qmoosa-public-testnet-reality-report.json
