name: Token accounting integrity
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integrity
      - run: npm run lint
      - run: npm run build
