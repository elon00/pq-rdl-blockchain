name: RDL Reality Gates

on:
  push:
    branches: ["qmoosa/reality-chain-v1"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Multi-node smoke
        run: bash scripts/multi-node-smoke.sh
      - name: Rustfmt diff artifact
        run: |
          cargo fmt --all
          git diff -- crates/rdl-node/src/main.rs crates/rdl-types/src/lib.rs > rustfmt.patch || true
      - name: Upload Rustfmt patch
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
      - name: Format check
        run: cargo fmt --all -- --check
