name: RDL Reality Gates

on:
  push:
    branches: ["qmoosa/reality-chain-v1"]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile
        run: cargo check --workspace --all-targets
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Multi-node smoke
        run: bash scripts/multi-node-smoke.sh
      - name: Rustfmt normalize and commit on branch pushes
        if: github.event_name == 'push'
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/rdl-node/src/main.rs crates/rdl-types/src/lib.rs
            git commit -m "style: normalize Rust formatting"
            git push origin HEAD:qmoosa/reality-chain-v1
          fi
      - name: Format check
        run: cargo fmt --all -- --check
