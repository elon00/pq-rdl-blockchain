services:
  # Devnet/Testnet-candidate validator 1 (bootstrap seed)
  rdl-validator-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdl-testnet-val-1
    command: ["rdl-node", "--listen", "0.0.0.0:7001"]
    environment:
      RDL_NODE_ID: validator-1
      RDL_DATA_DIR: /var/lib/rdl
      RDL_BOOTSTRAP_PEERS: rdl-validator-2:7002,rdl-validator-3:7003
      RDL_PRODUCTION_MODE: "false"
    ports: ["7001:7001"]
    volumes: [rdl-data-1:/var/lib/rdl]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "rdl-node", "--ping", "127.0.0.1:7001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [rdl-testnet-net]

  rdl-validator-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdl-testnet-val-2
    command: ["rdl-node", "--listen", "0.0.0.0:7002"]
    environment:
      RDL_NODE_ID: validator-2
      RDL_DATA_DIR: /var/lib/rdl
      RDL_BOOTSTRAP_PEERS: rdl-validator-1:7001,rdl-validator-3:7003
      RDL_PRODUCTION_MODE: "false"
    ports: ["7002:7002"]
    volumes: [rdl-data-2:/var/lib/rdl]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "rdl-node", "--ping", "127.0.0.1:7002"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [rdl-testnet-net]

  rdl-validator-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rdl-testnet-val-3
    command: ["rdl-node", "--listen", "0.0.0.0:7003"]
    environment:
      RDL_NODE_ID: validator-3
      RDL_DATA_DIR: /var/lib/rdl
      RDL_BOOTSTRAP_PEERS: rdl-validator-1:7001,rdl-validator-2:7002
      RDL_PRODUCTION_MODE: "false"
    ports: ["7003:7003"]
    volumes: [rdl-data-3:/var/lib/rdl]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "rdl-node", "--ping", "127.0.0.1:7003"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks: [rdl-testnet-net]

  # Prototype web UI/API. Mutation simulations are disabled in production mode by default.
  rdl-rpc-server:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rdl-testnet-rpc
    environment:
      PORT: "3000"
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      RDL_WEB_DATA_DIR: /var/lib/rdl-web
      RDL_CORS_ALLOWED_ORIGINS: ${RDL_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      RDL_ENABLE_SIMULATION_API: ${RDL_ENABLE_SIMULATION_API:-false}
      RDL_ADMIN_TOKEN: ${RDL_ADMIN_TOKEN:-}
      RDL_API_REQUESTS_PER_MINUTE: ${RDL_API_REQUESTS_PER_MINUTE:-120}
      RDL_MAX_JSON_BODY_KB: ${RDL_MAX_JSON_BODY_KB:-256}
    ports: ["3000:3000"]
    volumes: [rdl-web-data:/var/lib/rdl-web]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      rdl-validator-1:
        condition: service_healthy
    restart: unless-stopped
    networks: [rdl-testnet-net]

  # Optional Telegram bot. Its faucet/mining commands are local simulations, not public-chain settlement.
  rdl-telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: rdl-testnet-tg-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - rdl-rpc-server
    restart: unless-stopped
    networks: [rdl-testnet-net]

volumes:
  rdl-data-1:
  rdl-data-2:
  rdl-data-3:
  rdl-web-data:

networks:
  rdl-testnet-net:
    driver: bridge
